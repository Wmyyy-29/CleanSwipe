name: Bug report / Bug 反馈
description: Report a reproducible problem without sharing personal photos.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach personal photos, Apple account information, device identifiers, certificates, or provisioning profiles.
  - type: input
    id: version
    attributes:
      label: App revision
      description: Commit hash, tag, or branch name.
      placeholder: e.g. main at abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Xcode, iOS, device or simulator model.
      placeholder: Xcode 16, iOS 18, iPhone 16 Pro Max
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: App mode
      options:
        - Demo mode
        - Real photo library
        - Both
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal photos, metadata, account details, and signing information from this report.
          required: true

